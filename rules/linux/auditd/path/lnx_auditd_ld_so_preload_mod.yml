title: Modification of ld.so.preload
id: 4b3cb710-5e83-4715-8c45-8b2b5b3e5751
status: experimental
description: Detects modification of /etc/ld.so.preload using auditd syscall monitoring. This file is used to load shared objects into every new process, making it a prime target for persistence and rootkits.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1574.006/T1574.006.md
author: E.M. Anhaus, Aadith C H
date: 2019-10-24
modified: 2026-02-18
tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.defense-evasion
    - attack.t1574.006
logsource:
    product: linux
    service: auditd
detection:
    selection_file:
        type: 'PATH'
        name: '/etc/ld.so.preload'
    selection_syscall:
        type: 'SYSCALL'
        syscall:
            - 'open'
            - 'openat'
            - 'creat'
    selection_flags:
         a2|contains:
            - '2' 
            - '1' 
            - '40'
    condition: selection_file and selection_syscall and selection_flags
falsepositives:
    - Legitimate package installation (e.g., glibc updates)
    - Authorized security agents or performance profilers
level: high
